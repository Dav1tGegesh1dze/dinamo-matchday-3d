<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dinamo Road to Goal 3D</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none; }
      canvas { display: block; }
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.55); color: #fff; font: bold 40px sans-serif; cursor: pointer;
      }
      #kit { position: fixed; top: 16px; left: 16px; display: flex; gap: 10px; }
      #kit img { width: 48px; height: 48px; image-rendering: pixelated; opacity: 0.25; filter: grayscale(1); }
      #kit img.held { opacity: 1; filter: none; }
      #prompt, #message {
        position: fixed; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 8px;
        color: #fff; font: bold 26px sans-serif; white-space: nowrap;
      }
      #prompt { bottom: 60px; background: rgba(0, 0, 0, 0.6); }
      #message { top: 30%; background: #e30613; }
      #board {
        position: fixed; transform: translate(-50%, -50%); padding: 6px 14px; border: 3px solid #333; border-radius: 6px;
        background: #0b0b0b; color: #3cff5a; font: bold 26px monospace; text-shadow: 0 0 8px #3cff5a; white-space: nowrap;
      }
      #question {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 36px; background: rgba(0, 0, 0, 0.7); color: #fff; font: bold 36px sans-serif; text-align: center;
      }
      #question p { max-width: 1000px; margin: 0 24px; }
      #answers { display: grid; grid-template-columns: repeat(2, 440px); gap: 20px; }
      #answers button {
        padding: 22px; border: 0; border-radius: 10px; background: #fff; color: #0b3d91; font: bold 28px sans-serif; cursor: pointer;
      }
      #answers button.right { background: #1a9e3f; color: #fff; }
      #answers button.wrong { background: #e30613; color: #fff; }
      #countdown { display: flex; align-items: center; gap: 20px; width: 900px; font-size: 30px; }
      #bar { flex: 1; height: 16px; border-radius: 8px; background: #ffd500; transform-origin: left; }
      #objective {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 22px; border-radius: 8px;
        background: rgba(0, 0, 0, 0.55); color: #fff; font: bold 28px sans-serif; text-align: center; white-space: nowrap;
      }
      #objective small { display: block; margin-top: 2px; color: #ffd500; font-size: 20px; }
      #marker {
        position: fixed; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center;
        color: #ffd500; font: bold 22px sans-serif; text-shadow: 0 0 4px #000, 0 0 10px #000; pointer-events: none;
      }
      #marker.off { transform: translate(-50%, -50%); }
      #marker-pointer { font-size: 34px; line-height: 1; }
      [hidden] { display: none !important; }
      body:has(#question:not([hidden])) :is(#overlay, #prompt) { display: none; }
      body:has(.screen:not([hidden])) :is(#overlay, #prompt, #kit, #timer, #message, #board, #objective, #marker) { display: none; }
      #timer {
        position: fixed; top: 16px; right: 16px; padding: 4px 14px; border-radius: 8px;
        background: rgba(0, 0, 0, 0.55); color: #fff; font: bold 34px monospace;
      }
      .screen {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; background: radial-gradient(circle at 50% 30%, #1450a0, #061d4a); color: #fff; font-family: sans-serif;
      }
      .screen h1 { margin: 0; font-size: 52px; }
      #crest { width: 96px; height: 96px; image-rendering: pixelated; }
      #registration input {
        width: 480px; padding: 10px 16px; border: 3px solid #fff; border-radius: 8px; box-sizing: border-box;
        font-size: 26px; text-align: center; color: #0b3d91; outline: none;
      }
      #error { min-height: 30px; margin: 0; color: #ffd500; font-size: 22px; }
      .screen button.red {
        padding: 14px 40px; border: 0; border-radius: 10px; background: #e30613; color: #fff; font: bold 32px sans-serif; cursor: pointer;
      }
      .screen button.red.dim { opacity: 0.4; }
      #languages { position: fixed; right: 24px; bottom: 20px; display: flex; gap: 10px; }
      #languages button { border: 0; background: none; color: #7f9bd1; font: 26px sans-serif; cursor: pointer; }
      #languages button.chosen { color: #fff; font-weight: bold; }
      #subtitle { margin: 0; color: #ffd500; font-size: 32px; }
      #board-title { margin: 12px 0 0; color: #7f9bd1; font-size: 28px; }
      #rows { margin: 0; padding: 0; list-style: none; font-size: 26px; line-height: 1.45; text-align: center; }
      #rows .own { color: #ffd500; font-weight: bold; }
      #restart { margin-top: 12px; }
    </style>
  </head>
  <body>
    <div id="kit"></div>
    <div id="prompt" hidden></div>
    <div id="message" hidden></div>
    <div id="board" hidden></div>
    <div id="objective" hidden></div>
    <div id="marker" hidden><span id="marker-distance"></span><span id="marker-pointer"></span></div>
    <div id="timer"></div>
    <div id="overlay"></div>
    <section id="registration" class="screen" hidden>
      <img id="crest" src="assets/icons/crest.png" alt="" />
      <h1 id="title"></h1>
      <input id="name" maxlength="20" autocomplete="off" />
      <input id="phone" maxlength="20" inputmode="tel" autocomplete="off" />
      <input id="email" maxlength="40" autocomplete="off" />
      <p id="error"></p>
      <button id="start" class="red"></button>
      <div id="languages"><button data-lang="ka">KA</button><button data-lang="en">EN</button></div>
    </section>
    <section id="result" class="screen" hidden>
      <h1 id="headline"></h1>
      <p id="subtitle"></p>
      <h2 id="board-title"></h2>
      <ul id="rows"></ul>
      <button id="restart" class="red"></button>
    </section>
    <div id="question" hidden>
      <p id="question-text"></p>
      <div id="answers"></div>
      <div id="countdown"><div id="bar"></div><span id="seconds"></span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
