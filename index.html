<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dinamo Road to Goal 3D</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none; }
      canvas { display: block; }
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.55); color: #fff; font: bold 40px sans-serif; cursor: pointer;
      }
      #kit { position: fixed; top: 16px; left: 16px; display: flex; gap: 10px; }
      #kit img { width: 48px; height: 48px; image-rendering: pixelated; opacity: 0.25; filter: grayscale(1); }
      #kit img.held { opacity: 1; filter: none; }
      #prompt, #message {
        position: fixed; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 8px;
        color: #fff; font: bold 26px sans-serif; white-space: nowrap;
      }
      #prompt { bottom: 60px; background: rgba(0, 0, 0, 0.6); }
      #message { top: 30%; background: #e30613; }
      #board {
        position: fixed; transform: translate(-50%, -50%); padding: 6px 14px; border: 3px solid #333; border-radius: 6px;
        background: #0b0b0b; color: #3cff5a; font: bold 26px monospace; text-shadow: 0 0 8px #3cff5a; white-space: nowrap;
      }
      #question {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 36px; background: rgba(0, 0, 0, 0.7); color: #fff; font: bold 36px sans-serif; text-align: center;
      }
      #question p { max-width: 1000px; margin: 0 24px; }
      #answers { display: grid; grid-template-columns: repeat(2, 440px); gap: 20px; }
      #answers button {
        padding: 22px; border: 0; border-radius: 10px; background: #fff; color: #0b3d91; font: bold 28px sans-serif; cursor: pointer;
      }
      #answers button.right { background: #1a9e3f; color: #fff; }
      #answers button.wrong { background: #e30613; color: #fff; }
      #countdown { display: flex; align-items: center; gap: 20px; width: 900px; font-size: 30px; }
      #bar { flex: 1; height: 16px; border-radius: 8px; background: #ffd500; transform-origin: left; }
      [hidden] { display: none !important; }
      body:has(#question:not([hidden])) :is(#overlay, #prompt) { display: none; }
    </style>
  </head>
  <body>
    <div id="kit"></div>
    <div id="prompt" hidden></div>
    <div id="message" hidden></div>
    <div id="board" hidden></div>
    <div id="overlay"></div>
    <div id="question" hidden>
      <p id="question-text"></p>
      <div id="answers"></div>
      <div id="countdown"><div id="bar"></div><span id="seconds"></span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
